name: CI and Testing

on:
    workflow_dispatch:

env:
    python-version: "3.14"
    uv-version: "0.11.8"

jobs:
    linting:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Install Python
              uses: actions/setup-python@v7
              with:
                python-version: ${{env.python-version}}

            - name: Install uv
              uses: astral-sh/setup-uv@v10.3.0
              with:
                version: ${{env.uv-version}}

            - name: uv sync and run pylint
              run: |
                uv sync --locked
                uv run pylint api

            - name: Lint Dockerfile - Hadolint
              uses: hadolint/hadolint-action@v3.1.0
              with:
                dockerfile: Dockerfile
            
    testing:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Install Python
              uses: actions/setup-python@v7
              with:
                python-version: ${{env.python-version}}

            - name: Install uv
              uses: astral-sh/setup-uv@v10.3.0
              with:
                version: ${{env.uv-version}}

            - name: uv sync and run pytest
              run: |
                uv sync --locked
                uv run pytest tests
    
    build:
        runs-on: ubuntu-latest
        needs: linting
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
            
            - name: Build Docker image
              run: docker build -t hive-box .

