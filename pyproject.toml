[project]
name = "hive-box"
version = "0.0.1"
description = "Simple containerised app to print app version"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.142.4",
    "httpx2>=2.13.1",
    "prometheus-client>=0.26.0",
    "requests>=2.34.2",
]

[tool.fastapi]
entrypoint = "api.main:app"

[tool.pytest]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pylint>=4.1.3",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
]
